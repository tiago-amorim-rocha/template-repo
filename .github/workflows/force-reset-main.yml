name: Force reset main to template state
on:
  push:
    branches:
      - "claude/revert-game-changes-011CUjap2612um9T14iyumSp"
permissions:
  contents: write
jobs:
  force-reset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Force reset main to current branch state
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "Resetting main to $BRANCH state..."
          git fetch origin main
          git checkout main
          git reset --hard "$BRANCH"
          git push --force origin main
          echo "✅ Main has been reset to $BRANCH"
